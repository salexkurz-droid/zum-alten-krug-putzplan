<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zum alten Krug · Putzplan</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#26352c;background:#f5f5f0}*{box-sizing:border-box}body{margin:0}header{background:#203e30;color:white;padding:24px 18px}header>div,main{max-width:850px;margin:auto}h1{margin:0;font-size:1.65rem}header p{margin:8px 0 0;color:#d9e8db}main{padding:18px}section{background:white;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 2px 12px #0000000c}label{display:block;font-weight:650;margin:0 0 8px}input{width:100%;padding:12px;border:1px solid #c7d0c7;border-radius:9px;font:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#285e41;color:white}button:disabled{opacity:.55;cursor:not-allowed}.week-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.week-nav button{white-space:nowrap}.week-nav #period{text-align:center;margin:0;flex:1}.day{margin:20px 0}.day h2{font-size:1.1rem;margin:0 0 10px}.task{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid #edf0eb}.task strong{display:block}.task small{display:block;color:#617269;margin-top:4px}.done{color:#247043}.message{padding:12px;border-radius:8px;background:#fff1e5;color:#703d16}.hint{font-size:.88rem;color:#657368}.loading{color:#52665a}
</style>
</head>
<body>
<header><div><h1>Zum alten Krug</h1><p>Gemeinsamer Küchenputzplan</p></div></header>
<main>
<section><label for="name">Dein Name</label><input id="name" maxlength="80" placeholder="Vor- und Nachname eingeben" autocomplete="name"><p class="hint">Bitte trage deinen eigenen Namen ein, bevor du eine Aufgabe abhaken möchtest.</p></section>
<section><h2>Wochenplan</h2><div class="week-nav"><button id="previous" type="button" aria-label="Vorherige Woche">‹ Zurück</button><p id="period" class="hint"></p><button id="next" type="button" aria-label="Nächste Woche">Weiter ›</button></div><div id="status" class="loading">Aufgaben werden geladen …</div><div id="tasks"></div><button id="reload" type="button">Aktualisieren</button></section>
</main>
<script>
'use strict';
const PROJECT_URL='https://qdtkdhncgtuqllfrgoky.supabase.co';
// Den Publishable Key nur hier einsetzen; niemals einen Secret- oder service_role-Key.
const PUBLISHABLE_KEY='sb_publishable_1hz-RGWPoJGHSPpTGKlWJQ_eQDB0bSP';
const DAYS=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const $=id=>document.getElementById(id);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const nice=d=>new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d);
const parseDate=s=>new Date(s+'T12:00:00');
const startOfWeek=()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const addDays=(d,n)=>{const v=new Date(d);v.setDate(v.getDate()+n);return v};
const differenceDays=(a,b)=>Math.round((a-b)/86400000);
const configured=()=>PUBLISHABLE_KEY.startsWith('sb_publishable_')||PUBLISHABLE_KEY.startsWith('eyJ');
async function request(path,options={}){
 const res=await fetch(`${PROJECT_URL}/rest/v1/${path}`,{...options,headers:{'apikey':PUBLISHABLE_KEY,'Authorization':`Bearer ${PUBLISHABLE_KEY}`,'Content-Type':'application/json',...(options.headers||{})}});
 if(!res.ok){let details='';try{details=(await res.json()).message||''}catch{}throw new Error(details||`HTTP ${res.status}`)}
 if(res.status===204)return null;
 return res.json();
}
let busy=false;
let weekOffset=0;
async function load(){
 $('tasks').replaceChildren();
 if(!configured()){$('status').className='message';$('status').textContent='Der öffentliche Supabase-Schlüssel muss noch in der Datei index.html eingetragen werden.';return}
 $('status').className='loading';$('status').textContent='Aufgaben werden geladen …';
 try{
 const monday=addDays(startOfWeek(),weekOffset*7), sunday=addDays(monday,6);
 $('period').textContent=`Woche vom ${nice(monday)} bis ${nice(sunday)}`;
 const [tasks,records]=await Promise.all([
 request('reinigungsaufgaben?select=id,aufgabe,wochentag,intervall_wochen,startdatum&bereich=eq.K%C3%BCche&aktiv=eq.true&order=wochentag.asc,id.asc'),
 request(`reinigungsnachweise?select=aufgabe_id,faellig_am,mitarbeiter,erledigt_am&faellig_am=gte.${iso(monday)}&faellig_am=lte.${iso(sunday)}`)
 ]);
 const recordMap=new Map(records.map(r=>[`${r.aufgabe_id}|${r.faellig_am}`,r]));
 for(let day=2;day<=7;day++){
  const due=addDays(monday,day-1),dueIso=iso(due);
  const matching=tasks.filter(t=>{
   if(t.wochentag!==day)return false;
   const start=parseDate(t.startdatum);
   const elapsed=differenceDays(due,start);
   return elapsed>=0 && elapsed%(7*t.intervall_wochen)===0;
  });
  if(!matching.length)continue;
  const wrap=document.createElement('div');wrap.className='day';
  const h=document.createElement('h2');h.textContent=`${DAYS[day%7]}, ${nice(due)}`;wrap.append(h);
  for(const t of matching){
   const row=document.createElement('div');row.className='task';
   const info=document.createElement('div');const title=document.createElement('strong');title.textContent=t.aufgabe;info.append(title);
   const rec=recordMap.get(`${t.id}|${dueIso}`);
   const button=document.createElement('button');
   if(rec){const detail=document.createElement('small');detail.className='done';detail.textContent=`✓ Erledigt von ${rec.mitarbeiter} · ${new Intl.DateTimeFormat('de-DE',{dateStyle:'short',timeStyle:'short'}).format(new Date(rec.erledigt_am))}`;info.append(detail);button.textContent='Erledigt';button.disabled=true}
   else{button.textContent='Abhaken';const today=iso(new Date());const daysFromToday=differenceDays(parseDate(dueIso),parseDate(today));if(Math.abs(daysFromToday)>7){button.disabled=true;button.title='Abhaken nur innerhalb von 7 Tagen vor oder nach dem Fälligkeitsdatum möglich'}else{button.addEventListener('click',()=>complete(t.id,dueIso))}}
   row.append(info,button);wrap.append(row);
  }
  $('tasks').append(wrap);
 }
 $('status').textContent='';
 if(!$('tasks').children.length)$('status').textContent='Für diese Woche sind keine Aufgaben eingetragen.';
 }catch(err){$('status').className='message';$('status').textContent=`Verbindung fehlgeschlagen: ${err.message}`}
}
async function complete(taskId,dueDate){
 if(busy)return;
 const name=$('name').value.trim();
 if(name.length<2||name.length>80){alert('Bitte zuerst deinen Namen mit mindestens zwei Zeichen eintragen.');$('name').focus();return}
 if(!confirm(`Aufgabe wirklich als erledigt markieren?\nName: ${name}`))return;
 busy=true;
 try{await request('reinigungsnachweise',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({aufgabe_id:taskId,faellig_am:dueDate,mitarbeiter:name})});await load()}
 catch(err){alert(`Speichern fehlgeschlagen: ${err.message}`);await load()}
 finally{busy=false}
}
$('reload').addEventListener('click',load);
$('previous').addEventListener('click',()=>{weekOffset--;load()});
$('next').addEventListener('click',()=>{weekOffset++;load()});
load();
</script>
</body></html>
